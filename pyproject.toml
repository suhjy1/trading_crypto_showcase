[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "updown"
version = "1.0.0"
description = "Fair-value model and evaluation tools for short-dated crypto up/down binaries"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab", "matplotlib>=3.8", "pyarrow>=15", "requests"]

[tool.setuptools]
packages = ["updown"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
